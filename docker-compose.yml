# =============================================================================
# f1-decision-platform — local-run stack
#
# Brings up Postgres (n8n storage + our decision ledger, same instance),
# n8n (workflow orchestration), and Ollama (local model inference).
#
# Usage: `make up` (wraps `docker compose up -d`), see Makefile for the
# full lifecycle (down, logs, ps, warm, seed, import-workflows, ...).
#
# Env vars are loaded from `.env` (gitignored). Copy `.env.example` to
# `.env` and fill in real values before running.
# =============================================================================

services:
  postgres:
    image: postgres:16
    container_name: f1-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_POSTGRESDB_USER:-n8n}
      POSTGRES_PASSWORD: ${DB_POSTGRESDB_PASSWORD:-n8n}
      POSTGRES_DB: ${DB_POSTGRESDB_DATABASE:-n8n}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # This same database holds BOTH n8n's own internal tables (workflows,
      # executions, credentials, ...) and our decision-ledger tables
      # (decision_runs, evidence_snapshots, ...). n8n manages its own tables
      # itself on boot; ours are created here via the initdb entrypoint.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_POSTGRESDB_USER:-n8n} -d ${DB_POSTGRESDB_DATABASE:-n8n}"]
      interval: 5s
      timeout: 5s
      retries: 10
    env_file:
      - .env

  n8n:
    image: n8nio/n8n:latest
    container_name: f1-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Lets n8n reach a service on the host (e.g. a native GPU Ollama) via
    # host.docker.internal on Linux too. To use your host Ollama instead of the
    # container: set OLLAMA_BASE_URL=http://host.docker.internal:11434 in .env
    # and start without the ollama service: docker compose up -d postgres n8n grafana
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${DB_POSTGRESDB_DATABASE:-n8n}
      DB_POSTGRESDB_USER: ${DB_POSTGRESDB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${DB_POSTGRESDB_PASSWORD:-n8n}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: ${N8N_PORT:-5678}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      N8N_DIAGNOSTICS_ENABLED: "false"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      # Local-only convenience: n8n normally requires a secure cookie over
      # HTTPS. We're on plain http://localhost here, so disable that check.
      N8N_SECURE_COOKIE: "false"
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
      # Mount workflow JSON exports read-only so `make import-workflows`
      # can import them via the n8n CLI inside the container.
      - ./workflows:/workflows:ro
    env_file:
      - .env

  ollama:
    image: ollama/ollama:latest
    container_name: f1-ollama
    restart: unless-stopped
    ports:
      # Host port only — n8n reaches Ollama in-cluster at ollama:11434 regardless.
      # Override OLLAMA_PORT if you already run Ollama on the host (a native GPU
      # install also binds 11434).
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    # --- Optional NVIDIA GPU acceleration ---------------------------------
    # Without this block, Ollama runs on CPU (slower, but works everywhere).
    # To enable GPU acceleration on a host with an NVIDIA GPU:
    #   1. Install the NVIDIA driver + the nvidia-container-toolkit on the
    #      Docker host (see https://github.com/NVIDIA/nvidia-container-toolkit).
    #   2. Uncomment the `deploy.resources.reservations.devices` block below.
    #   3. `docker compose up -d ollama` (recreate the container).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    env_file:
      - .env

  # Observability: a Grafana dashboard over the decision_ledger (decision volume,
  # policy-approval rate, judge scores, action mix, and the auditable row-level
  # ledger). Provisioned automatically — datasource + dashboard load on boot.
  grafana:
    image: grafana/grafana:11.2.0
    container_name: f1-grafana
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      # consumed by infra/grafana/provisioning/datasources/postgres.yml
      DB_POSTGRESDB_USER: ${DB_POSTGRESDB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${DB_POSTGRESDB_PASSWORD:-n8n}
      DB_POSTGRESDB_DATABASE: ${DB_POSTGRESDB_DATABASE:-n8n}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro

volumes:
  postgres-data:
  n8n-data:
  grafana-data:
  ollama-data:
